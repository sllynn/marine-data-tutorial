<title id="ais-title">How AIS reports reach the world</title><desc id="ais-desc">Class A transponders on a cargo ship and passenger ferry and a Class B transponder on a sailing yacht broadcast AIS messages over VHF. Nearby vessels and coastal stations receive the messages directly. Low Earth orbit satellites also receive the broadcasts and relay collected reports through ground stations to data services.</desc>

<g id="reading-guide"><title>How to read this illustration</title><text x="65" y="851" class="label">One broadcast, several reception paths</text>
<path d="M65 890H135" class="link"/><text x="152" y="897" class="small">Local VHF: nearby vessels and coastal stations</text>
<path d="M830 890H900" class="satlink"/><text x="918" y="897" class="small">Satellite reception and relay to the ground</text>
<text x="65" y="950" class="small">Class A is typically used on commercial ships; Class B is common on smaller craft.</text>
<text x="65" y="982" class="small">Reception depends on radio range, antenna height and coverage. Satellite collection extends visibility offshore.</text>
