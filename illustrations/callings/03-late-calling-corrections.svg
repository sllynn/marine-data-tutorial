<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="04-late-calling-corrections-title 04-late-calling-corrections-desc"><title id="04-late-calling-corrections-title">Corrections replace the answer rather than only appending rows</title><desc id="04-late-calling-corrections-desc">Initial inside reports10,20,30 form one run. Late outside25 splits it. Late inside8 moves the first run start earlier, retiring its old calling anchor.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172321;font-size:16px} .heading{font-size:23px;font-weight:700;letter-spacing:-.4px}.label{font-size:14px;font-weight:600}.small{font-size:13px;fill:#61716e}.muted{fill:#61716e}.a{fill:#087f8c}.b{fill:#cb6329}.red{fill:#b84048}.big{font-size:28px;font-weight:700}</style><rect width="1000" height="480" fill="white" rx="20"/><text x="40" y="48" class="heading" text-anchor="start">Late evidence can split a calling — or change its anchor.</text><text x="40" y="108" class="label" text-anchor="start">Initially</text><line x1="100" y1="140" x2="940" y2="140" stroke="#dce5e2" stroke-width="2"/><text x="145" y="165" class="small" text-anchor="middle">0</text><text x="289" y="165" class="small" text-anchor="middle">8</text><text x="325" y="165" class="small" text-anchor="middle">10</text><text x="505" y="165" class="small" text-anchor="middle">20</text><text x="595" y="165" class="small" text-anchor="middle">25</text><text x="685" y="165" class="small" text-anchor="middle">30</text><text x="865" y="165" class="small" text-anchor="middle">40</text><text x="40" y="228" class="label" text-anchor="start">Late OUT at 25</text><line x1="100" y1="260" x2="940" y2="260" stroke="#dce5e2" stroke-width="2"/><text x="145" y="285" class="small" text-anchor="middle">0</text><text x="289" y="285" class="small" text-anchor="middle">8</text><text x="325" y="285" class="small" text-anchor="middle">10</text><text x="505" y="285" class="small" text-anchor="middle">20</text><text x="595" y="285" class="small" text-anchor="middle">25</text><text x="685" y="285" class="small" text-anchor="middle">30</text><text x="865" y="285" class="small" text-anchor="middle">40</text><text x="40" y="348" class="label" text-anchor="start">Then late IN at 8</text><line x1="100" y1="380" x2="940" y2="380" stroke="#dce5e2" stroke-width="2"/><text x="145" y="405" class="small" text-anchor="middle">0</text><text x="289" y="405" class="small" text-anchor="middle">8</text><text x="325" y="405" class="small" text-anchor="middle">10</text><text x="505" y="405" class="small" text-anchor="middle">20</text><text x="595" y="405" class="small" text-anchor="middle">25</text><text x="685" y="405" class="small" text-anchor="middle">30</text><text x="865" y="405" class="small" text-anchor="middle">40</text><line x1="325" y1="140" x2="685" y2="140" stroke="#087f8c" stroke-width="7"/><circle cx="325" cy="140" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="325" y="125" class="label" text-anchor="middle">IN</text><circle cx="505" cy="140" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="505" y="125" class="label" text-anchor="middle">IN</text><circle cx="685" cy="140" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="685" y="125" class="label" text-anchor="middle">IN</text><circle cx="865" cy="140" r="7" fill="#61716e" stroke="white" stroke-width="2"/><text x="865" y="125" class="label" text-anchor="middle">OUT</text><text x="900" y="145" class="small" text-anchor="middle">1 visit</text><line x1="325" y1="260" x2="505" y2="260" stroke="#087f8c" stroke-width="7"/><circle cx="505" cy="260" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="505" y="245" class="label" text-anchor="middle"></text><circle cx="685" cy="260" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="685" y="245" class="label" text-anchor="middle">IN</text><circle cx="325" cy="260" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="325" y="245" class="label" text-anchor="middle">IN</text><circle cx="595" cy="260" r="7" fill="#cb6329" stroke="white" stroke-width="2"/><text x="595" y="245" class="label" text-anchor="middle">OUT</text><circle cx="865" cy="260" r="7" fill="#61716e" stroke="white" stroke-width="2"/><text x="865" y="245" class="label" text-anchor="middle">OUT</text><text x="900" y="265" class="small" text-anchor="middle">2 visits</text><line x1="289" y1="380" x2="505" y2="380" stroke="#087f8c" stroke-width="7"/><circle cx="289" cy="380" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="289" y="365" class="label" text-anchor="middle">IN</text><circle cx="325" cy="380" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="325" y="365" class="label" text-anchor="middle"></text><circle cx="505" cy="380" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="505" y="365" class="label" text-anchor="middle"></text><circle cx="685" cy="380" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="685" y="365" class="label" text-anchor="middle">IN</text><circle cx="595" cy="380" r="7" fill="#cb6329" stroke="white" stroke-width="2"/><text x="595" y="365" class="label" text-anchor="middle">OUT</text><circle cx="865" cy="380" r="7" fill="#61716e" stroke="white" stroke-width="2"/><text x="865" y="365" class="label" text-anchor="middle">OUT</text><text x="900" y="385" class="small" text-anchor="middle">2 visits</text><text x="40" y="447" class="label" text-anchor="start">A8 moves the first port entry to 8. Replace the old entry key atomically.</text></svg>