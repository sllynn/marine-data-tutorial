<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="03-gaps-and-islands-title 03-gaps-and-islands-desc"><title id="03-gaps-and-islands-title">A calling is an island of consecutive inside observations</title><desc id="03-gaps-and-islands-desc">All-position numbers1through6 include outside reports. Inside-match numbers1through3 omit them. Differences1,1,2 identify two inside runs.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172321;font-size:16px} .heading{font-size:23px;font-weight:700;letter-spacing:-.4px}.label{font-size:14px;font-weight:600}.small{font-size:13px;fill:#61716e}.muted{fill:#61716e}.a{fill:#087f8c}.b{fill:#cb6329}.red{fill:#b84048}.big{font-size:28px;font-weight:700}</style><rect width="1000" height="460" fill="white" rx="20"/><text x="40" y="48" class="heading" text-anchor="start">Number every position. Then number only the inside matches.</text><text x="40" y="115" class="label" text-anchor="start">Time (min)</text><text x="180" y="115" class="" text-anchor="middle">0</text><text x="310" y="115" class="" text-anchor="middle">10</text><text x="440" y="115" class="" text-anchor="middle">20</text><text x="570" y="115" class="" text-anchor="middle">25</text><text x="700" y="115" class="" text-anchor="middle">30</text><text x="830" y="115" class="" text-anchor="middle">40</text><text x="40" y="168" class="label" text-anchor="start">Location match</text><rect x="265" y="142" width="220" height="39" rx="6" fill="#e2f4f3"/><rect x="660" y="142" width="80" height="39" rx="6" fill="#fff0e6"/><text x="180" y="168" class="" text-anchor="middle">OUT</text><text x="310" y="168" class="" text-anchor="middle">IN</text><text x="440" y="168" class="" text-anchor="middle">IN</text><text x="570" y="168" class="" text-anchor="middle">OUT</text><text x="700" y="168" class="" text-anchor="middle">IN</text><text x="830" y="168" class="" text-anchor="middle">OUT</text><text x="40" y="221" class="label" text-anchor="start">Position #</text><text x="180" y="221" class="" text-anchor="middle">1</text><text x="310" y="221" class="" text-anchor="middle">2</text><text x="440" y="221" class="" text-anchor="middle">3</text><text x="570" y="221" class="" text-anchor="middle">4</text><text x="700" y="221" class="" text-anchor="middle">5</text><text x="830" y="221" class="" text-anchor="middle">6</text><text x="40" y="274" class="label" text-anchor="start">Match #</text><text x="180" y="274" class="" text-anchor="middle">—</text><text x="310" y="274" class="" text-anchor="middle">1</text><text x="440" y="274" class="" text-anchor="middle">2</text><text x="570" y="274" class="" text-anchor="middle">—</text><text x="700" y="274" class="" text-anchor="middle">3</text><text x="830" y="274" class="" text-anchor="middle">—</text><text x="40" y="327" class="label" text-anchor="start">Difference</text><rect x="265" y="301" width="220" height="39" rx="6" fill="#e2f4f3"/><rect x="660" y="301" width="80" height="39" rx="6" fill="#fff0e6"/><text x="180" y="327" class="label" text-anchor="middle">—</text><text x="310" y="327" class="label" text-anchor="middle">1</text><text x="440" y="327" class="label" text-anchor="middle">1</text><text x="570" y="327" class="label" text-anchor="middle">—</text><text x="700" y="327" class="label" text-anchor="middle">2</text><text x="830" y="327" class="label" text-anchor="middle">—</text><text x="330" y="395" class="a" text-anchor="middle">Difference 1 → first visit</text><text x="740" y="395" class="b" text-anchor="middle">Difference 2 → second visit</text><text x="40" y="435" class="muted" text-anchor="start">OUT at 25 advances only Position #, so the next IN begins a new island.</text></svg>