<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="01-port-and-berth-title 01-port-and-berth-desc"><title id="01-port-and-berth-title">One position, two kinds of presence</title><desc id="01-port-and-berth-desc">Schematic nested port and berth polygons. Points can be outside both, inside only the port, or inside both.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172321;font-size:16px} .heading{font-size:23px;font-weight:700;letter-spacing:-.4px}.label{font-size:14px;font-weight:600}.small{font-size:13px;fill:#61716e}.muted{fill:#61716e}.a{fill:#087f8c}.b{fill:#cb6329}.red{fill:#b84048}.big{font-size:28px;font-weight:700}</style><rect width="1000" height="460" fill="white" rx="20"/><text x="40" y="48" class="heading" text-anchor="start">A berth visit sits inside a broader port calling.</text><rect x="95" y="95" width="665" height="240" rx="18" fill="#e2f4f3"/><text x="120" y="130" class="label" text-anchor="start">PORT LOCATION</text><rect x="325" y="175" width="230" height="100" rx="10" fill="#c0e4df"/><text x="345" y="200" class="label" text-anchor="start">BERTH LOCATION</text><line x1="50" y1="245" x2="820" y2="245" stroke="#61716e" stroke-width="2" stroke-dasharray="7 6"/><circle cx="50" cy="245" r="7" fill="#61716e" stroke="white" stroke-width="2"/><text x="50" y="230" class="label" text-anchor="middle">Outside</text><circle cx="210" cy="245" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="210" y="230" class="label" text-anchor="middle">Port only</text><circle cx="440" cy="245" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="440" y="230" class="label" text-anchor="middle">Port + berth</text><rect x="669" y="159" width="12" height="12" rx="2" fill="#cb6329"/><text x="675" y="150" class="label" text-anchor="middle">B · port only</text><text x="800" y="120" class="small" text-anchor="start">VESSELS A AND B</text><text x="800" y="149" class="small" text-anchor="start">Separate vessel IDs</text><text x="40" y="385" class="label" text-anchor="start">A position can support both locations; the calling keys still differ.</text><text x="40" y="420" class="muted" text-anchor="start">Core H3 cells match directly; boundary chips use exact point containment.</text></svg>