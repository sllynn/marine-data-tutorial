<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">How position errors reach an AIS dataset</title><desc id="desc">Position calculation, AIS broadcast, radio reception and feed delivery can each introduce errors into a dataset.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#087f8c" stroke-width="1.6"/></marker></defs><rect width="1200" height="630" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="40.00" y="48.00" font-size="29" fill="#172321" font-weight="700" text-anchor="start">How position errors reach an AIS dataset</text><text x="40.00" y="82.00" font-size="18" fill="#61716e" font-weight="400" text-anchor="start">Errors can occur during positioning, broadcast, reception or delivery.</text><rect x="40" y="125" width="250" height="235" rx="14" fill="#f5f8f7" stroke="none"/><text x="58.00" y="165.00" font-size="21" fill="#172321" font-weight="700" text-anchor="start">1 · Position source</text><text x="58.00" y="198.00" font-size="17" fill="#087f8c" font-weight="600" text-anchor="start">GNSS / navigation</text><text x="58.00" y="245.00" font-size="16" fill="#61716e" font-weight="400" text-anchor="start">The vessel calculates</text><text x="58.00" y="273.00" font-size="16" fill="#61716e" font-weight="400" text-anchor="start">its position and includes</text><text x="58.00" y="301.00" font-size="16" fill="#61716e" font-weight="400" text-anchor="start">it in an AIS report.</text><path d="M 165.000 371.000 L 165.000 399.000" fill="none" stroke="#61716e" stroke-width="2" /><text x="165.00" y="429.00" font-size="16" fill="#cb6329" font-weight="600" text-anchor="middle">Positioning errors</text><path d="M 298.000 245.000 L 321.000 245.000" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="330" y="125" width="250" height="235" rx="14" fill="#f5f8f7" stroke="none"/><text x="348.00" y="165.00" font-size="21" fill="#172321" font-weight="700" text-anchor="start">2 · AIS report</text><text x="348.00" y="198.00" font-size="17" fill="#087f8c" font-weight="600" text-anchor="start">Vessel broadcast</text><text x="348.00" y="245.00" font-size="16" fill="#61716e" font-weight="400" text-anchor="start">Position, time, speed</text><text x="348.00" y="273.00" font-size="16" fill="#61716e" font-weight="400" text-anchor="start">and identifiers are</text><text x="348.00" y="301.00" font-size="16" fill="#61716e" font-weight="400" text-anchor="start">reported over radio.</text><path d="M 455.000 371.000 L 455.000 399.000" fill="none" stroke="#61716e" stroke-width="2" /><text x="455.00" y="429.00" font-size="16" fill="#cb6329" font-weight="600" text-anchor="middle">Reported-field faults</text><path d="M 588.000 245.000 L 611.000 245.000" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="620" y="125" width="250" height="235" rx="14" fill="#f5f8f7" stroke="none"/><text x="638.00" y="165.00" font-size="21" fill="#172321" font-weight="700" text-anchor="start">3 · Reception</text><text x="638.00" y="198.00" font-size="17" fill="#087f8c" font-weight="600" text-anchor="start">Terrestrial / satellite</text><text x="638.00" y="245.00" font-size="16" fill="#61716e" font-weight="400" text-anchor="start">Receivers can miss reports</text><text x="638.00" y="273.00" font-size="16" fill="#61716e" font-weight="400" text-anchor="start">or receive copies of</text><text x="638.00" y="301.00" font-size="16" fill="#61716e" font-weight="400" text-anchor="start">the same transmission.</text><path d="M 745.000 371.000 L 745.000 399.000" fill="none" stroke="#61716e" stroke-width="2" /><text x="745.00" y="429.00" font-size="16" fill="#cb6329" font-weight="600" text-anchor="middle">Gaps and duplicates</text><path d="M 878.000 245.000 L 901.000 245.000" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="910" y="125" width="250" height="235" rx="14" fill="#f5f8f7" stroke="none"/><text x="928.00" y="165.00" font-size="21" fill="#172321" font-weight="700" text-anchor="start">4 · Delivery</text><text x="928.00" y="198.00" font-size="17" fill="#087f8c" font-weight="600" text-anchor="start">Provider / dataset</text><text x="928.00" y="245.00" font-size="16" fill="#61716e" font-weight="400" text-anchor="start">Records are assembled</text><text x="928.00" y="273.00" font-size="16" fill="#61716e" font-weight="400" text-anchor="start">and delivered, sometimes</text><text x="928.00" y="301.00" font-size="16" fill="#61716e" font-weight="400" text-anchor="start">late or out of order.</text><path d="M 1035.000 371.000 L 1035.000 399.000" fill="none" stroke="#61716e" stroke-width="2" /><text x="1035.00" y="429.00" font-size="16" fill="#cb6329" font-weight="600" text-anchor="middle">Processing / feed errors</text><rect x="40" y="470" width="1120" height="92" rx="14" fill="#e2f4f3" stroke="none"/><text x="60.00" y="505.00" font-size="21" fill="#172321" font-weight="700" text-anchor="start">Keep the original reports alongside the results of each check.</text><text x="60.00" y="537.00" font-size="17" fill="#61716e" font-weight="400" text-anchor="start">Receiver data, vessel records and independent positions can help explain a flagged report.</text><text x="40.00" y="603.00" font-size="14" fill="#61716e" font-weight="400" text-anchor="start">GNSS positioning, AIS radio transmission and feed processing can each fail separately.</text></g></svg>