000 413.000 L 815.000 408.000 L 815.000 418.000" fill="none" stroke="#172321" stroke-width="2" /><text x="785.00" y="438.00" font-size="14" fill="#61716e" font-weight="400" text-anchor="middle">500 m</text><text x="730.00" y="488.00" font-size="17" fill="#172321" font-weight="600" text-anchor="start">Inside land and over 150 m from its edge:</text><text x="730.00" y="515.00" font-size="17" fill="#b84048" font-weight="400" text-anchor="start">flag the position for review.</text><text x="730.00" y="561.00" font-size="17" fill="#172321" font-weight="600" text-anchor="start">Within 150 m on either side of the edge:</text><text x="730.00" y="588.00" font-size="17" fill="#cb6329" font-weight="400" text-anchor="start">leave the coastal result uncertain.</text><text x="730.00" y="637.00" font-size="15" fill="#61716e" font-weight="400" text-anchor="start">The band is a teaching threshold.</text><text x="730.00" y="662.00" font-size="15" fill="#61716e" font-weight="400" text-anchor="start">This map is too generalised for</text><text x="730.00" y="687.00" font-size="15" fill="#61716e" font-weight="400" text-anchor="start">detailed harbour or navigation checks.</text><text x="40.00" y="752.00" font-size="15" fill="#61716e" font-weight="400" text-anchor="start">Land: Natural Earth 1:10m, public domain. Positions: synthetic reports from notebook 00.</text><text x="40.00" y="782.00" font-size="15" fill="#61716e" font-weight="400" text-anchor="start">The notebook uses ST_Transform for UTM ↔ longitude/latitude conversions. Panels use different scales.</text></g></svg>