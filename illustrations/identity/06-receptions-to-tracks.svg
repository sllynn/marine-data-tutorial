<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 540" role="img" aria-labelledby="title desc"><title id="title">AIS feed to Bronze, track assignment and Silver</title><desc id="desc">Four stages preserve every reception in Bronze, then deduplicate and resolve tracks using relevant Silver history, publishing accepted positions and revisable track IDs in Silver.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#087f8c" stroke-width="1.5"/></marker></defs><rect width="1260" height="540" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="48" font-size="28" fill="#172321" font-weight="700">From received messages to assigned positions</text><text x="40" y="82" font-size="17" fill="#61716e" font-weight="400">Bronze preserves receptions. Silver publishes the current track decision for each accepted observation.</text><g id="stage-0"><title>AIS feed</title><rect x="40" y="125" width="265" height="235" rx="16" fill="#f5f8f7"/><text x="60" y="162" font-size="23" fill="#172321" font-weight="700">AIS feed</text><text x="60" y="192" font-size="17" fill="#087f8c" font-weight="600">Position reports</text><text x="60" y="237" font-size="16" fill="#172321" font-weight="400">A0 · receiver 1</text><text x="60" y="267" font-size="16" fill="#172321" font-weight="400">A0 · receiver 2</text><text x="60" y="297" font-size="16" fill="#172321" font-weight="400">A20 · receiver 1</text></g><path d="M312 240 h25" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><g id="stage-1"><title>Bronze</title><rect x="345" y="125" width="265" height="235" rx="16" fill="#f5f8f7"/><text x="365" y="162" font-size="23" fill="#172321" font-weight="700">Bronze</text><text x="365" y="192" font-size="17" fill="#087f8c" font-weight="600">Every reception</text><text x="365" y="237" font-size="16" fill="#172321" font-weight="400">obs_id · MMSI · time</text><text x="365" y="267" font-size="16" fill="#172321" font-weight="400">LAT · LON · source</text><text x="365" y="297" font-size="16" fill="#172321" font-weight="400">Reported vessel fields</text></g><path d="M617 240 h25" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><g id="stage-2"><title>Track assignment</title><rect x="650" y="125" width="265" height="235" rx="16" fill="#f5f8f7"/><text x="670" y="162" font-size="23" fill="#172321" font-weight="700">Track assignment</text><text x="670" y="192" font-size="17" fill="#087f8c" font-weight="600">foreachBatch</text><text x="670" y="237" font-size="16" fill="#172321" font-weight="400">Read in-scope Silver</text><text x="670" y="267" font-size="16" fill="#172321" font-weight="400">H3 + movement checks</text><text x="670" y="297" font-size="16" fill="#172321" font-weight="400">Resolve each MMSI</text></g><path d="M922 240 h25" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><g id="stage-3"><title>Silver</title><rect x="955" y="125" width="265" height="235" rx="16" fill="#e2f4f3"/><text x="975" y="162" font-size="23" fill="#172321" font-weight="700">Silver</text><text x="975" y="192" font-size="17" fill="#087f8c" font-weight="600">Accepted positions</text><text x="975" y="237" font-size="16" fill="#172321" font-weight="400">obs_id · MMSI · time</text><text x="975" y="267" font-size="16" fill="#172321" font-weight="400">LAT · LON · sources</text><text x="975" y="297" font-size="16" fill="#172321" font-weight="400">track_id · track_status</text></g><path d="M1085 370 V415 H785 V370" fill="none" stroke="#087f8c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="810" y="445" font-size="17" fill="#087f8c" font-weight="600">History feeds the next replay</text><text x="40" y="410" font-size="18" fill="#172321" font-weight="600">Repeated receptions share obs_id.</text><text x="40" y="443" font-size="17" fill="#61716e" font-weight="400">A0 contributes one Silver position, with both receivers retained.</text><text x="40" y="502" font-size="18" fill="#172321" font-weight="400">When late A10 arrives, MERGE can update A20 and A30’s track_id as well as insert A10.</text></g></svg>