<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="03-two-time-boundaries-title 03-two-time-boundaries-desc"><title id="03-two-time-boundaries-title">Correction window versus maximum link gap</title><desc id="03-two-time-boundaries-desc">Horizon60 cutoff15. Positions20 and40 are both mutable but cannot link across20minutes. Frozen minute10 can seed the window.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172321;font-size:16px} .heading{font-size:23px;font-weight:700;letter-spacing:-.4px}.label{font-size:14px;font-weight:600}.small{font-size:13px;fill:#61716e}.muted{fill:#61716e}.a{fill:#087f8c}.b{fill:#cb6329}.red{fill:#b84048}.big{font-size:28px;font-weight:700}</style><rect width="1000" height="460" fill="white" rx="20"/><text x="40" y="48" class="heading" text-anchor="start">Two time limits. Two different jobs.</text><g id="frozen-region"><title>Frozen observations before minute15</title><rect x="100" y="100" width="210" height="95" rx="0" fill="#f5f8f7"/></g><g id="mutable-region"><title>Correction window includes minute15 through60</title><rect x="310" y="100" width="630" height="95" rx="0" fill="#e2f4f3"/></g><text x="205.0" y="133" class="label" text-anchor="middle">Frozen</text><text x="625.0" y="133" class="label" text-anchor="middle">45-minute correction window</text><line x1="310" y1="85" x2="310" y2="370" stroke="#61716e" stroke-width="2" stroke-dasharray="7 6"/><text x="310" y="77" class="label" text-anchor="middle">Cutoff · 15</text><line x1="940" y1="85" x2="940" y2="370" stroke="#087f8c" stroke-width="2"/><text x="940" y="77" class="label" text-anchor="middle">Horizon · 60</text><text x="100" y="221" class="small" text-anchor="middle">0</text><text x="240" y="221" class="small" text-anchor="middle">10</text><text x="310" y="221" class="small" text-anchor="middle">15</text><text x="380" y="221" class="small" text-anchor="middle">20</text><text x="660" y="221" class="small" text-anchor="middle">40</text><text x="800" y="221" class="small" text-anchor="middle">50</text><text x="940" y="221" class="small" text-anchor="middle">60</text><line x1="100" y1="200" x2="940" y2="200" stroke="#dce5e2" stroke-width="2"/><circle cx="100" cy="177" r="7" fill="#61716e" stroke="white" stroke-width="2"/><text x="100" y="162" class="label" text-anchor="middle">too old for a seed</text><circle cx="240" cy="177" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="240" y="162" class="label" text-anchor="middle">seed</text><circle cx="380" cy="177" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="380" y="162" class="label" text-anchor="middle">P20</text><circle cx="660" cy="177" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="660" y="162" class="label" text-anchor="middle">P40</text><circle cx="800" cy="177" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="800" y="162" class="label" text-anchor="middle">P50</text><g id="gap-too-large"><title>Two mutable positions with a 20-minute gap</title><line x1="380" y1="268" x2="660" y2="268" stroke="#b84048" stroke-width="4"/><text x="520" y="258" class="red" text-anchor="middle">20 min &gt; 12</text><text x="520" y="294" class="small" text-anchor="middle">Both mutable; this link is ineligible.</text></g><g id="gap-eligible"><title>Ten-minute gap is time eligible</title><line x1="660" y1="335" x2="800" y2="335" stroke="#087f8c" stroke-width="4"/><text x="730" y="326" class="a" text-anchor="middle">10 min ≤ 12</text></g><text x="40" y="402" class="label" text-anchor="start">Window: which assignments may change?</text><text x="40" y="432" class="muted" text-anchor="start">Link gap: which pairs may connect? Frozen seeds supply context, not corrections.</text></svg>