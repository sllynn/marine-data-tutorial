<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="02-late-bridge-title 02-late-bridge-desc"><title id="02-late-bridge-title">Late report joins two segments</title><desc id="02-late-bridge-desc">Before the A10 report arrives A0 cannot link across a 20-minute gap. Afterwards consecutive gaps are ten minutes.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172321;font-size:16px} .heading{font-size:23px;font-weight:700;letter-spacing:-.4px}.label{font-size:14px;font-weight:600}.small{font-size:13px;fill:#61716e}.muted{fill:#61716e}.a{fill:#087f8c}.b{fill:#cb6329}.red{fill:#b84048}.big{font-size:28px;font-weight:700}</style><rect width="1000" height="460" fill="white" rx="20"/><text x="40" y="48" class="heading" text-anchor="start">A late observation changes an earlier answer.</text><text x="40" y="99" class="label" text-anchor="start">BATCH 0 · bridge missing</text><line x1="120" y1="135" x2="900" y2="135" stroke="#dce5e2" stroke-width="2"/><line x1="580" y1="135" x2="800" y2="135" stroke="#087f8c" stroke-width="5"/><line x1="140" y1="135" x2="580" y2="135" stroke="#b84048" stroke-width="2" stroke-dasharray="7 6"/><text x="360" y="187" class="red" text-anchor="middle">20 min &gt; 12 min link gap</text><circle cx="140" cy="135" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="140" y="120" class="label" text-anchor="middle">A0</text><text x="140" y="163" class="small" text-anchor="middle">0 min</text><circle cx="360" cy="135" r="8" fill="white" stroke="#61716e" stroke-dasharray="3 3"/><text x="360" y="117" class="small" text-anchor="middle">missing</text><text x="360" y="163" class="small" text-anchor="middle">10 min</text><circle cx="580" cy="135" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="580" y="120" class="label" text-anchor="middle">A20</text><text x="580" y="163" class="small" text-anchor="middle">20 min</text><circle cx="800" cy="135" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="800" y="120" class="label" text-anchor="middle">A30</text><text x="800" y="163" class="small" text-anchor="middle">30 min</text><text x="900" y="140" class="small" text-anchor="middle">Observed</text><text x="40" y="274" class="label" text-anchor="start">BATCH 1 · bridge received</text><line x1="120" y1="310" x2="900" y2="310" stroke="#dce5e2" stroke-width="2"/><line x1="140" y1="310" x2="800" y2="310" stroke="#087f8c" stroke-width="5"/><circle cx="140" cy="310" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="140" y="295" class="label" text-anchor="middle">A0</text><text x="140" y="338" class="small" text-anchor="middle">0 min</text><circle cx="360" cy="310" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="360" y="295" class="label" text-anchor="middle">A10</text><text x="360" y="338" class="small" text-anchor="middle">10 min</text><circle cx="580" cy="310" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="580" y="295" class="label" text-anchor="middle">A20</text><text x="580" y="338" class="small" text-anchor="middle">20 min</text><circle cx="800" cy="310" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="800" y="295" class="label" text-anchor="middle">A30</text><text x="800" y="338" class="small" text-anchor="middle">30 min</text><text x="900" y="315" class="small" text-anchor="middle">Observed</text><text x="40" y="405" class="muted" text-anchor="start">A10 arrives later, but belongs between A0 and A20 in observation time.</text><text x="40" y="435" class="label" text-anchor="start">Replay merges the segment: A20 and A30 take the A0 anchor.</text></svg>