<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="05-segments-to-histories-title 05-segments-to-histories-desc"><title id="05-segments-to-histories-title">Segments to vessel-history hypotheses</title><desc id="05-segments-to-histories-desc">Two vessels share an MMSI. Separate segment chains could map to separate vessel histories. The linking stage is planned, not implemented.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172321;font-size:16px} .heading{font-size:23px;font-weight:700;letter-spacing:-.4px}.label{font-size:14px;font-weight:600}.small{font-size:13px;fill:#61716e}.muted{fill:#61716e}.a{fill:#087f8c}.b{fill:#cb6329}.red{fill:#b84048}.big{font-size:28px;font-weight:700}</style><rect width="1000" height="460" fill="white" rx="20"/><text x="40" y="48" class="heading" text-anchor="start">A reporting gap splits segments, not necessarily vessel identity.</text><text x="40" y="78" class="small" text-anchor="start">PLANNED NEXT STAGE · segment linking is on the backlog</text><text x="50" y="135" class="label" text-anchor="start">Same MMSI · vessel A</text><line x1="80" y1="170" x2="270" y2="170" stroke="#087f8c" stroke-width="6"/><circle cx="80" cy="170" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="80" y="155" class="label" text-anchor="middle">A segment 1</text><circle cx="270" cy="170" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="270" y="155" class="label" text-anchor="middle">end</text><line x1="270" y1="170" x2="430" y2="170" stroke="#087f8c" stroke-width="2" stroke-dasharray="7 6"/><text x="350" y="152" class="small" text-anchor="middle">gap &gt; 12 min</text><line x1="430" y1="170" x2="590" y2="170" stroke="#087f8c" stroke-width="6"/><circle cx="430" cy="170" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="430" y="155" class="label" text-anchor="middle">A segment 2</text><circle cx="590" cy="170" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="590" y="155" class="label" text-anchor="middle">end</text><line x1="610" y1="170" x2="680" y2="170" stroke="#61716e" stroke-width="2" stroke-dasharray="7 6"/><rect x="690" y="136" width="265" height="70" rx="14" fill="#e2f4f3"/><text x="710" y="165" class="label" text-anchor="start">A history hypothesis</text><text x="710" y="189" class="small" text-anchor="start">IMO only with identity evidence</text><text x="50" y="265" class="label" text-anchor="start">Same MMSI · vessel B</text><line x1="80" y1="300" x2="270" y2="300" stroke="#cb6329" stroke-width="6"/><rect x="74" y="294" width="12" height="12" rx="2" fill="#cb6329"/><text x="80" y="285" class="label" text-anchor="middle">B segment 1</text><rect x="264" y="294" width="12" height="12" rx="2" fill="#cb6329"/><text x="270" y="285" class="label" text-anchor="middle">end</text><line x1="270" y1="300" x2="430" y2="300" stroke="#cb6329" stroke-width="2" stroke-dasharray="7 6"/><text x="350" y="282" class="small" text-anchor="middle">gap &gt; 12 min</text><line x1="430" y1="300" x2="590" y2="300" stroke="#cb6329" stroke-width="6"/><rect x="424" y="294" width="12" height="12" rx="2" fill="#cb6329"/><text x="430" y="285" class="label" text-anchor="middle">B segment 2</text><rect x="584" y="294" width="12" height="12" rx="2" fill="#cb6329"/><text x="590" y="285" class="label" text-anchor="middle">end</text><line x1="610" y1="300" x2="680" y2="300" stroke="#61716e" stroke-width="2" stroke-dasharray="7 6"/><rect x="690" y="266" width="265" height="70" rx="14" fill="#fff0e6"/><text x="710" y="295" class="label" text-anchor="start">B history hypothesis</text><text x="710" y="319" class="small" text-anchor="start">IMO only with identity evidence</text><text x="40" y="405" class="muted" text-anchor="start">Proposed links require plausible transitions and corroborating identity evidence.</text><text x="40" y="435" class="label" text-anchor="start">Keep segment IDs. Preserve competing histories and unresolved associations.</text></svg>