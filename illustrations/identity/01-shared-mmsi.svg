<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="01-shared-mmsi-title 01-shared-mmsi-desc"><title id="01-shared-mmsi-title">One MMSI, two vessels</title><desc id="01-shared-mmsi-desc">Schematic spatial routes. Naive links zigzag between vessels; separate segments preserve all observations.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172321;font-size:16px} .heading{font-size:23px;font-weight:700;letter-spacing:-.4px}.label{font-size:14px;font-weight:600}.small{font-size:13px;fill:#61716e}.muted{fill:#61716e}.a{fill:#087f8c}.b{fill:#cb6329}.red{fill:#b84048}.big{font-size:28px;font-weight:700}</style><rect width="1000" height="460" fill="white" rx="20"/><text x="40" y="48" class="heading" text-anchor="start">One identifier. Two independent movement sequences.</text><rect x="35" y="75" width="450" height="310" rx="14" fill="#f5f8f7"/><rect x="515" y="75" width="450" height="310" rx="14" fill="#f5f8f7"/><text x="60" y="110" class="label" text-anchor="start">Connect everything by MMSI</text><text x="540" y="110" class="label" text-anchor="start">Retain separate track segments</text><g id="naive-zigzag"><title>Naive interleaved links</title><line x1="110" y1="155" x2="380" y2="155" stroke="#61716e" stroke-width="2" stroke-dasharray="7 6"/><line x1="380" y1="155" x2="345" y2="210" stroke="#61716e" stroke-width="2" stroke-dasharray="7 6"/><line x1="345" y1="210" x2="180" y2="245" stroke="#61716e" stroke-width="2" stroke-dasharray="7 6"/><line x1="180" y1="245" x2="310" y2="245" stroke="#61716e" stroke-width="2" stroke-dasharray="7 6"/><line x1="310" y1="245" x2="215" y2="320" stroke="#61716e" stroke-width="2" stroke-dasharray="7 6"/><line x1="215" y1="320" x2="275" y2="320" stroke="#61716e" stroke-width="2" stroke-dasharray="7 6"/></g><g id="naive-A0"><title>A0 observed position</title><circle cx="110" cy="155" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="110" y="140" class="label" text-anchor="middle">A0</text></g><g id="naive-A20"><title>A20 observed position</title><circle cx="180" cy="245" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="180" y="230" class="label" text-anchor="middle">A20</text></g><g id="naive-A30"><title>A30 observed position</title><circle cx="215" cy="320" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="215" y="305" class="label" text-anchor="middle">A30</text></g><g id="naive-B0"><title>B0 observed position</title><rect x="374" y="149" width="12" height="12" rx="2" fill="#cb6329"/><text x="380" y="140" class="label" text-anchor="middle">B0</text></g><g id="naive-B10"><title>B10 observed position</title><rect x="339" y="204" width="12" height="12" rx="2" fill="#cb6329"/><text x="345" y="195" class="label" text-anchor="middle">B10</text></g><g id="naive-B20"><title>B20 observed position</title><rect x="304" y="239" width="12" height="12" rx="2" fill="#cb6329"/><text x="310" y="230" class="label" text-anchor="middle">B20</text></g><g id="naive-B30"><title>B30 observed position</title><rect x="269" y="314" width="12" height="12" rx="2" fill="#cb6329"/><text x="275" y="305" class="label" text-anchor="middle">B30</text></g><g id="segment-a"><title>Independent segment A</title><line x1="660" y1="245" x2="695" y2="320" stroke="#087f8c" stroke-width="4"/></g><g id="segment-b"><title>Independent segment B</title><line x1="860" y1="155" x2="825" y2="210" stroke="#cb6329" stroke-width="4"/><line x1="825" y1="210" x2="790" y2="245" stroke="#cb6329" stroke-width="4"/><line x1="790" y1="245" x2="755" y2="320" stroke="#cb6329" stroke-width="4"/></g><g id="resolved-A0"><title>A0 observed position</title><circle cx="590" cy="155" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="590" y="140" class="label" text-anchor="middle">A0</text></g><g id="resolved-A20"><title>A20 observed position</title><circle cx="660" cy="245" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="660" y="230" class="label" text-anchor="middle">A20</text></g><g id="resolved-A30"><title>A30 observed position</title><circle cx="695" cy="320" r="7" fill="#087f8c" stroke="white" stroke-width="2"/><text x="695" y="305" class="label" text-anchor="middle">A30</text></g><g id="resolved-B0"><title>B0 observed position</title><rect x="854" y="149" width="12" height="12" rx="2" fill="#cb6329"/><text x="860" y="140" class="label" text-anchor="middle">B0</text></g><g id="resolved-B10"><title>B10 observed position</title><rect x="819" y="204" width="12" height="12" rx="2" fill="#cb6329"/><text x="825" y="195" class="label" text-anchor="middle">B10</text></g><g id="resolved-B20"><title>B20 observed position</title><rect x="784" y="239" width="12" height="12" rx="2" fill="#cb6329"/><text x="790" y="230" class="label" text-anchor="middle">B20</text></g><g id="resolved-B30"><title>B30 observed position</title><rect x="749" y="314" width="12" height="12" rx="2" fill="#cb6329"/><text x="755" y="305" class="label" text-anchor="middle">B30</text></g><text x="60" y="360" class="small" text-anchor="start">Arrival order is not a vessel journey.</text><text x="540" y="360" class="small" text-anchor="start">A0 stays tentative until the bridge arrives.</text><text x="40" y="422" class="label" text-anchor="start">● Vessel A    ■ Vessel B</text><text x="400" y="422" class="muted" text-anchor="start">Shared MMSI does not require a shared track.</text></svg>